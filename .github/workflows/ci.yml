name: engine-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # the live job only: catch drift in the Nebius APIs without paying per push
    - cron: "17 6 * * 1-5"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: packages/engine

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/engine/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine test suite
        run: python -m pytest -q

      - name: Smoke the mock demo (deterministic, no network)
        run: python -m nge.demo_nebius --mock

  mcp-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/engine/requirements-local.txt

      - name: Install deps (+ mcp SDK 1.x)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Nodus MCP client <-> real GPU MCP server
        run: python -m pytest -q tests/test_mcp_bridge_integration.py

  # Real Nemotron + real Token Factory sandboxes. Deliberately NOT on push or
  # pull_request: it spends Nebius credits, depends on an external service, and
  # secrets are unavailable to fork PRs. Manual or scheduled only, and it is not
  # a required check - a Nebius outage must not block a merge.
  #
  # It exists because the mock jobs above cannot see any of this. When the
  # sandboxes were first switched on, the shards were running `pytest` in an
  # empty container: exit=127, nothing tested, and the run still summarised as
  # "0 failure(s)" and exited 0. nge.live_check asserts evidence of work rather
  # than trusting the exit code.
  live-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/engine
    env:
      # a simulated fleet ledger: no GPU is allocated, so the cost is the
      # Nemotron calls plus the sandboxes the shards actually run in
      NGE_FLEET_MODE: mock
      NGE_SANDBOX: token_factory
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      NEBIUS_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/engine/requirements.txt

      - name: Check credentials are configured
        id: creds
        run: |
          if [ -z "$NEBIUS_API_KEY" ] || [ -z "$NEBIUS_PROJECT_ID" ]; then
            {
              echo "### live-smoke skipped"
              echo ""
              echo "\`NEBIUS_API_KEY\` / \`NEBIUS_PROJECT_ID\` are not set in"
              echo "repository secrets, so **nothing was verified against Nebius**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::live-smoke skipped - Nebius secrets are not configured"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.creds.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          # --live imports nodus_agent to install the `nebius:` backend patch,
          # which pulls nodus_perceptual -> numpy. The engine requirements do
          # not cover the vendored runtime, so the first CI run died on
          # ModuleNotFoundError: No module named 'numpy' - present locally,
          # absent on the runner.
          pip install -r requirements.txt -r ../nodus/requirements-ci.txt contree-sdk

      - name: Import the whole --live path before spending anything
        if: steps.creds.outputs.present == 'true'
        run: |
          python -c "
          import nge
          from nge.backends import register
          register.apply(); register.verify()
          from nge import demo_nebius, live_check, orchestrator, planner, symbols
          from nge.sandbox import token_factory
          from nge.fleet import nebius
          print('live path imports clean')
          "

      - name: Sandbox smoke (auth + spawn + exec)
        if: steps.creds.outputs.present == 'true'
        run: python -m nge.sandbox.token_factory

      - name: Live run (2 shards)
        if: steps.creds.outputs.present == 'true'
        run: |
          python -m nge.demo_nebius --live --shards 2 --json > live.json
          tail -c 400 live.json

      - name: Assert the run actually did the work
        if: steps.creds.outputs.present == 'true'
        run: |
          # --json prints a human summary before the report, so keep from the
          # first brace onwards
          python -c "import pathlib; t = pathlib.Path('live.json').read_text(encoding='utf-8'); pathlib.Path('report.json').write_text(t[t.index('{'):], encoding='utf-8')"
          # `| tee` would hand the step tee's exit code and the assertions could
          # never fail the job - the same silent green this job exists to catch
          set -o pipefail
          python -m nge.live_check report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && steps.creds.outputs.present == 'true'
        with:
          name: live-run-report
          path: |
            packages/engine/report.json
            packages/engine/out/
          retention-days: 14
