name: engine-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: packages/engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/engine/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine test suite
        run: python -m pytest -q

      - name: Smoke the mock demo (deterministic, no network)
        run: python -m nge.demo_nebius --mock

  mcp-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/engine/requirements-local.txt

      - name: Install deps (+ mcp SDK 1.x)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Nodus MCP client <-> real GPU MCP server
        run: python -m pytest -q tests/test_mcp_bridge_integration.py
