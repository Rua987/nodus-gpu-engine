[pytest]
# importlib : importe chaque module directement, sans passer par __init__.py
# capture=fd : résistant aux modules qui remplacent sys.stdout
addopts = --capture=fd -q --import-mode=importlib
testpaths = tests
# Ignore les dossiers de sauvegarde/archives même si un chemin explicite est
# passé (ex: `pytest .`). Évite que d'anciens scripts test_*.py qui font
# sys.exit() à l'import cassent la collection.
norecursedirs = SAUVEGARDE_* generated_skills_* .git __pycache__ .pytest_cache backups
